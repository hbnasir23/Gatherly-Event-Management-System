<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsfgefg</title>
  <style>
    :root { --bg: #f6f7fb; --card: #ffffff; --ink: #1d2433; --muted: #5b6475; --primary: #4f46e5; --accent: #0ea5e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); padding: 16px; }
    main { background: var(--card); border-radius: 16px; padding: 48px 40px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 2.4rem; color: var(--primary); }
    h2 { margin: 0 0 32px; font-weight: 500; font-size: 1.15rem; color: var(--muted); }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 10px; padding: 12px 22px; font-size: 1rem; cursor: pointer; color: #fff; }
    #btn-explore { background: var(--primary); }
    #btn-register { background: var(--accent); }
    #msg { margin-top: 24px; min-height: 1.5em; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Gatherly</h1>
    <h2>eventc  Management System</h2>
    <div class="actions">
      <button id="btn-explore" type="button">Explore Events</button>
      <button id="btn-register" type="button">Register Now</button>
    </div>
    <p id="msg"></p>
  </main>
  <script>
    const msg = document.getElementById('msg');
    document.getElementById('btn-explore').onclick = () => { msg.textContent = 'Upcoming events are coming soon!'; };
    document.getElementById('btn-register').onclick = () => { msg.textContent = 'Thanks for your interest in Gatherly!'; };
  </script>
</body>
</html>
